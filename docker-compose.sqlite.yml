# =============================================================================
# Profile: sqlite
#
#   cp .env.docker.example .env.docker    # then set the super admin password
#   docker compose --env-file .env.docker -f docker-compose.sqlite.yml up -d --build
#
# `--env-file .env.docker` is required, not decoration. A service's `env_file:`
# puts variables *into a container*, while `${...}` reads variables *from the shell
# or from the file named by --env-file*. The two never overlap, so a value in
# `.env.docker` is invisible to the interpolation below unless --env-file says so.
#
# Three containers from one image: the API, the bot and the queue. Not one
# container running all three, because the three fail independently and are
# restarted independently, and the project already assumes separate processes -
# each takes its own lock file and writes its own log. A queue that wedges should
# not take the dashboard down with it.
#
# A fourth, `mcp`, joins them in both stacks: it serves HTTP, so it is a service
# like `serve` rather than another background process, and it is the one you can
# leave off entirely. Nothing else in the stack talks to it.
#
# This is a file rather than a compose `profile`, and that is not a preference.
# A profile cannot give one service two different environments, which is exactly
# the difference between here and the postgres file: `serve` under sqlite and
# `serve` under postgres are the same image and the same command with a different
# database, and expressing that needs two service definitions. Two files is the
# honest form of that.
#
# The database is a file in the mounted volume. That is fine for one machine,
# and it is the reason the postgres profile exists: three containers writing one
# SQLite file over a Docker Desktop volume is the part of this setup most likely
# to be slow, or to lock, on macOS and Windows. On Linux with a local volume it
# is unremarkable. See the README.
# =============================================================================

name: sawa9ly-sqlite

# Everything the four processes have in common. The differences between them
# are a command and a published port, nothing else.
x-app: &app
  build:
    context: .
    dockerfile: Dockerfile
  image: sawa9ly-api:latest
  restart: unless-stopped
  env_file:
    - path: .env.docker
      required: false
  environment:
    # Both are required, and compose refuses to start without them. A super
    # account is created from these on first boot, so an empty value would be a
    # dashboard anyone could sign in to.
    SUPER_ADMIN_USERNAME: ${SUPER_ADMIN_USERNAME:-admin}
    SUPER_ADMIN_PASSWORD: ${SUPER_ADMIN_PASSWORD:?set SUPER_ADMIN_PASSWORD in .env.docker, and pass --env-file .env.docker so compose can read it}
    # Force SQLite, rather than merely not mentioning a server.
    #
    # `--env-file .env.docker` puts every variable in that file into every
    # container, and one shared file is going to carry DB_NAME and DB_PASSWORD
    # because the postgres stack needs them. The application prefers a server
    # over a file the moment DB_NAME is set, so leaving these alone would make
    # this stack boot, pick a database, and try to reach
    # `postgresql://...@localhost:5432` - a postgres this stack does not have and
    # never will. Naming the driver is what makes this file mean SQLite.
    DB_DRIVER: sqlite
    DB_NAME: ""
    DB_HOST: ""
    DB_PORT: ""
    DB_USER: ""
    DB_PASSWORD: ""
    DATABASE_URL: ""
  volumes:
    # The database, on a volume, because it is the one thing in the whole
    # deployment that cannot be recreated: it holds the accounts, the API keys and
    # the order history. Without this, `docker compose down` would take the
    # database with it.
    - sawa9ly-database:/var/lib/sawa9ly
    #
    # Deliberately no volume for the logs, and no volume for the lock files.
    #
    # The logs are already somewhere to read them: each of these three
    # containers has its own `docker logs`, which is one stream per process and
    # carries the same lines as the per-subsystem files inside the container.
    # Persisting the files as well would mean a second copy to rotate, store and
    # delete, with nothing in it that the streams do not already have. The
    # per-subsystem files still exist, and still earn their place on a machine
    # where there is one terminal rather than three.
    #
    # The lock files are per-process state with no meaning once the process is
    # gone, so a volume would be the opposite of what a volume is for.

services:
  serve:
    <<: *app
    command: ["python", "main.py", "serve"]
    ports:
      # `API_PUBLISHED_HOST` is the address on the *host*, and it defaults to the
      # host's own loopback: this is an admin surface with real API keys behind
      # it, and reaching it from the network should be a deliberate act rather
      # than a default someone inherits.
      #
      # It is a separate variable from `API_HOST` because the two answer different
      # questions. `API_HOST` is what the process binds *inside* the container,
      # where the loopback interface is the container's own and binding to it
      # publishes nothing - that is why it is 0.0.0.0. `API_PUBLISHED_HOST` is
      # what Docker exposes on the machine.
      - "${API_PUBLISHED_HOST:-127.0.0.1}:${API_PUBLISHED_PORT:-8000}:${API_PORT:-8000}"

  telegram:
    <<: *app
    command: ["python", "main.py", "telegram", "listen"]
    # Serves nothing over HTTP, so the image's HTTP health check would only ever
    # report this container unhealthy.
    healthcheck:
      disable: true

  cron:
    <<: *app
    command: ["python", "main.py", "cron", "listen"]
    healthcheck:
      disable: true

  # The MCP server: this project's operations as tools, for an AI agent.
  #
  # Published to the host's loopback, like the API and for the same reason, with
  # one thing said plainly: `tools/list` is NOT authenticated. Anything that can
  # reach this port sees the whole tool set - every name and description - without
  # presenting a key. Every tool *call* does need a key, and one of type `mcp`,
  # but the catalogue of tools is visible. Loopback is therefore not politeness
  # here, it is the only thing standing between the network and a list of tools
  # that can place real orders.
  #
  # `MCP_PUBLISHED_HOST` is the one knob for that, and it is deliberately a
  # separate variable from `MCP_HOST`: the container binds 0.0.0.0 because the
  # loopback interface in there is its own, while the host side defaults to
  # 127.0.0.1 because reaching this from another machine should be a deliberate
  # act. Widening the published host without putting something in front of it that
  # checks the key is the mistake this split makes hard to make by accident.
  mcp:
    <<: *app
    command: ["python", "main.py", "mcp"]
    ports:
      - "${MCP_PUBLISHED_HOST:-127.0.0.1}:${MCP_PUBLISHED_PORT:-8001}:${MCP_PORT:-8001}"
    # The image's check asks for /docs, which this container does not serve, so
    # the test is replaced rather than disabled: this one is a real liveness
    # probe, not a formality.
    #
    # A plain GET on the MCP mount is refused — **401** with a WWW-Authenticate
    # challenge, because the endpoint demands a bearer token and a GET carries
    # none. That 401 is the healthy answer, and it is a better probe than "the
    # port is open": a refused connection means the server is down, and a 404
    # means MCP_PATH is wrong, so all three failures are distinguishable where a
    # bare socket check would call them all success. 406 is accepted too, because
    # that is what the same endpoint answers when the transport is reached
    # without the Accept header it wants.
    #
    # `http.client` rather than `urllib` because urllib raises on a 4xx, and
    # inverting that exception is what keeps this to one line.
    healthcheck:
      test: ["CMD", "python", "-c", "import http.client,os,sys;c=http.client.HTTPConnection('127.0.0.1',int(os.getenv('MCP_PORT','8001')),timeout=4);c.request('GET',os.getenv('MCP_PATH','/mcp/'));r=c.getresponse();sys.exit(0 if r.status in (401,406) else 1)"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

volumes:
  sawa9ly-database:
