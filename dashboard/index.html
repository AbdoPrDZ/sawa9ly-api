<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <!--
      A publicDir file, so it is referenced from the site root and Vite puts the
      base in front of it. Writing the prefix in as well, with %BASE_URL%, gets
      it doubled in dev — where Vite already rewrites this tag — and the request
      went out as /dashboard/dashboard/favicon.ico.
    -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <title>Sawa9ly API Dashboard</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
